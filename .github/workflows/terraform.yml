name: terraform

# Pull requests: fmt, validate and plan. The plan is shown in the run summary.
# Merges to main: the same, then apply, after approval on the production
# environment if it has required reviewers.
#
# Only the main configuration (terraform/) is applied. terraform/bootstrap
# holds the state bucket and the roles this workflow uses, so it is validated
# here but only ever applied by an engineer.
on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

# One run at a time against the shared state, and never cancel one mid-apply.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "~> 1.10"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }} # bootstrap output state_bucket_name
  # Values that terraform.tfvars holds locally.
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-west-1' }}
  TF_VAR_github_repository: ${{ github.repository }}
  # This repository uses GitHub's immutable OIDC subject format, which carries
  # the owner and repository IDs so the trust survives a rename.
  TF_VAR_github_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}

# Third-party actions are pinned to a full commit SHA, with the release in a
# trailing comment. A tag can be moved to different code; a SHA cannot.
jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive terraform

      # -backend=false: validate needs providers and modules, not state, so
      # this job runs without any cloud credentials.
      - name: Validate
        run: |
          for dir in terraform terraform/bootstrap; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  plan:
    name: Plan
    needs: validate
    # Fork PRs cannot get an OIDC token, so there is nothing to plan with.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived AWS credentials
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Read-only role. Its trust policy only accepts pull_request tokens.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }} # bootstrap output terraform_plan_role_arn
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-plan-${{ github.run_id }}

      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Plan summary
        run: |
          {
            echo "### Terraform plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: validate
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Running in this environment is what lets the job assume the apply role,
    # and required reviewers on it turn the apply into an approval step.
    environment: production
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for short-lived AWS credentials
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }} # bootstrap output terraform_apply_role_arn
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-tf-apply-${{ github.run_id }}

      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      # Plan and apply in the same job, so what is applied is exactly the plan
      # printed here, against the state as it is now.
      - name: Plan
        run: terraform plan -no-color -out=tfplan

      - name: Apply
        run: terraform apply -no-color tfplan

      - name: Outputs
        run: |
          {
            echo "### Terraform outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
