# App of apps. Applied once by hand after Argo CD is installed:
#
#   kubectl apply -f gitops/root.yaml
#
# From then on, adding or changing a file in gitops/apps/ is how things get
# deployed. No finalizer on purpose: deleting this Application does not
# delete the apps it created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sadebare/devops-case-study.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
