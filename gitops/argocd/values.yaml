# Values for the official Argo CD chart, installed once by hand:
#
#   helm upgrade --install argocd argo/argo-cd --version 10.10.2 \
#     --namespace argocd --create-namespace -f gitops/argocd/values.yaml
#
# Kept minimal: one replica of each component, no SSO, no notifications.

# No SSO yet, so Dex is not needed. Log in as admin with the generated password.
dex:
  enabled: false

notifications:
  enabled: false

server:
  service:
    # No public load balancer. Reach the UI with kubectl port-forward.
    type: ClusterIP
