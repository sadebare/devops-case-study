apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-api
  labels:
    app.kubernetes.io/name: items-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: items-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired replica count during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: items-api
    spec:
      serviceAccountName: items-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Prefer spreading replicas across nodes so one node failure does not
      # take out the service. "ScheduleAnyway" keeps a single-node dev cluster usable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: items-api
      containers:
        - name: items-api
          # Placeholder. The registry and tag are set in kustomization.yaml
          # (images:), which is what CI or a GitOps controller would update.
          image: items-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: items-api-config
            - secretRef:
                name: items-api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              # Memory limit = hard ceiling (OOM-kill beats node pressure).
              # No CPU limit on purpose: CPU is compressible, and a limit
              # causes throttling even when the node is idle. The request
              # still guarantees a fair share. See README.
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Startup: give the process up to 30s to come up before liveness applies.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: restart only if the process stops answering at all.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: gates traffic; fails as soon as shutdown begins.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
