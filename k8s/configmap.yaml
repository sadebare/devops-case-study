apiVersion: v1
kind: ConfigMap
metadata:
  name: items-api-config
  labels:
    app.kubernetes.io/name: items-api
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  # How long the app keeps serving after SIGTERM while it is removed from
  # Service endpoints. Must stay below terminationGracePeriodSeconds.
  SHUTDOWN_DELAY: "5s"
