apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: items-api

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml

# Single place to point the Deployment at a built image. Replace the account
# ID, region and tag (CI prints the tag and digest in its run summary), or run:
#   kustomize edit set image items-api=<registry>/items-api:<tag>
images:
  - name: items-api
    newName: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/items-api
    newTag: REPLACE_WITH_COMMIT_SHA
