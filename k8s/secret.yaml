# PLACEHOLDER ONLY. This file exists to show the shape of the Secret the
# Deployment expects. Real values must never be committed: in a real setup
# this object is created by External Secrets Operator (from AWS Secrets
# Manager) or committed encrypted as a SealedSecret. See README.
apiVersion: v1
kind: Secret
metadata:
  name: items-api-secrets
  labels:
    app.kubernetes.io/name: items-api
type: Opaque
stringData:
  # Bearer token required for write requests (POST /api/v1/items).
  API_TOKEN: "REPLACE_ME"
