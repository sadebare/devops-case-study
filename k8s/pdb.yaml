# Keeps at least one replica running through voluntary disruptions such as
# node drains and cluster upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: items-api
  labels:
    app.kubernetes.io/name: items-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: items-api
