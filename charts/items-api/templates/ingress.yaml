{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "items-api.name" . }}
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the API is exposed publicly; /healthz and /readyz are for the kubelet.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "items-api.name" . }}
                port:
                  name: http
{{- end }}
