{{- if .Values.secret.create }}
# Local clusters only. Anywhere else the Secret is created outside git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Bearer token required for write requests (POST /api/v1/items).
  API_TOKEN: {{ required "secret.apiToken is required when secret.create=true" .Values.secret.apiToken | quote }}
{{- end }}
