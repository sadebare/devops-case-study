apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "items-api.name" . }}
  labels:
    {{- include "items-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "items-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired replica count during a rollout
  template:
    metadata:
      labels:
        {{- include "items-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the config changes; envFrom is only read at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "items-api.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Prefer spreading replicas across nodes so one node failure does not
      # take out the service. "ScheduleAnyway" keeps a single-node dev cluster usable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "items-api.selectorLabels" . | nindent 14 }}
      containers:
        - name: items-api
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (the commit SHA tag pushed by CI)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.PORT | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "items-api.name" . }}-config
            - secretRef:
                name: {{ .Values.secret.name }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Startup: give the process up to 30s to come up before liveness applies.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Liveness: restart only if the process stops answering at all.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: gates traffic; fails as soon as shutdown begins.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
